[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "config-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0"
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/config-models"]
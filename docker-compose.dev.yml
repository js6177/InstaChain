# Dev overlay: remote debug ports and source bind mounts.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   make dev
services:
  layer2ledgerapihandler:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgerapihandler
      args:
        INSTALL_DEBUG: "1"
    ports:
      - "${LAYER2LEDGER_APIHANDLER_DEBUG_PORT:-5678}:5678"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
      PYTHONPATH: /app/layer2ledgerbatched/src
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5678
      - --wait-for-client
      - -m
      - uvicorn
      - layer2ledgerbatched.layer2ledgerapihandler.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledgerbatched/src:/app/layer2ledgerbatched/src:ro
      - ./backend/packages:/app/packages:ro
    restart: "no"

  layer2ledgerdbwriter:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgerdbwriter
      args:
        INSTALL_DEBUG: "1"
    ports:
      - "${LAYER2LEDGER_DBWRITER_DEBUG_PORT:-5679}:5679"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
      PYTHONPATH: /app/layer2ledgerbatched/src
    command:
      - python
      - -m
      - debugpy
      - --listen
      - 0.0.0.0:5679
      - --wait-for-client
      - -m
      - layer2ledgerbatched.layer2ledgerdbwriter.main
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledgerbatched/src:/app/layer2ledgerbatched/src:ro
      - ./backend/packages:/app/packages:ro
    restart: "no"

  layer2ledgeroauthmanager:
    ports:
      - "${LAYER2OAUTH_DEBUG_PORT:-6499}:6499"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
    command:
      - bun
      - run
      - dev:debug
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledgeroauthmanager/src:/app/backend/layer2ledgeroauthmanager/src:ro
      - ./shared/config-loader:/app/shared/config-loader:ro
      - ./shared/pubkey-utils:/app/shared/pubkey-utils:ro
    healthcheck:
      disable: true
    restart: "no"

  wallet-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.wallet-web
      target: dev
    ports: !override
      - "${WALLET_WEB_PORT:-5173}:5173"
    env_file:
      - ./frontend/wallet/.env.docker
    volumes:
      - ./frontend/wallet/apps/web/src:/app/frontend/wallet/apps/web/src:ro
      - ./frontend/wallet/packages:/app/frontend/wallet/packages:ro
      - ./shared:/app/shared:ro
    depends_on:
      layer2ledgerapihandler:
        condition: service_started
      layer2ledgeroauthmanager:
        condition: service_started
    restart: "no"

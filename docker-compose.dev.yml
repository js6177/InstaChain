# Dev overlay: remote debug ports and source bind mounts.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   make dev
services:
  bitcoin-core:
    volumes: !override
      - bitcoin_core_data:/home/bitcoin/.bitcoin
      - ./.config/dev/bitcoin.conf:/config/bitcoin.conf:ro

  layer2ledgerapihandler:
    ports:
      - "${LAYER2LEDGER_APIHANDLER_DEBUG_PORT:-5678}:5678"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
    command:
      - bun
      - --inspect=0.0.0.0:5678
      - run
      - src/layer2ledgerapihandler/index.ts
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledger/src:/app/backend/layer2ledger/src:ro
      - ./shared/config-loader:/app/shared/config-loader:ro
      - ./shared/openl2-messaging:/app/shared/openl2-messaging:ro
      - ./shared/pubkey-utils:/app/shared/pubkey-utils:ro
    restart: "no"

  layer2ledgerdbwriter:
    ports:
      - "${LAYER2LEDGER_DBWRITER_DEBUG_PORT:-5679}:5679"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
    command:
      - bun
      - --inspect=0.0.0.0:5679
      - run
      - src/layer2ledgerdbwriter/index.ts
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledger/src:/app/backend/layer2ledger/src:ro
      - ./shared/config-loader:/app/shared/config-loader:ro
      - ./shared/openl2-messaging:/app/shared/openl2-messaging:ro
    restart: "no"

  layer2ledgeroauthmanager:
    ports:
      - "${LAYER2OAUTH_DEBUG_PORT:-6499}:6499"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
    command:
      - bun
      - run
      - dev:debug
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledgeroauthmanager/src:/app/backend/layer2ledgeroauthmanager/src:ro
      - ./shared/config-loader:/app/shared/config-loader:ro
      - ./shared/pubkey-utils:/app/shared/pubkey-utils:ro
    healthcheck:
      disable: true
    restart: "no"

  layer2bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2bridge
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_CONFIG_PATH: /app/.config
      OPENL2_OUTPUT_PATH: /app/.output
    volumes:
      - ./.config:/app/.config:ro
      - layer2bridge_output:/app/.output
      - ./backend/layer2bridge/src:/app/backend/layer2bridge/src:ro
      - ./shared/config-loader:/app/shared/config-loader:ro
      - ./shared/openl2-messaging:/app/shared/openl2-messaging:ro
      - ./shared/api-layer2ledger:/app/shared/api-layer2ledger:ro
      - ./shared/pubkey-utils:/app/shared/pubkey-utils:ro
    restart: "no"

  wallet-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.wallet-web
      target: dev
    ports: !override
      - "${WALLET_WEB_PORT:-5173}:5173"
    env_file:
      - ./frontend/wallet/.env.docker
    volumes:
      - ./frontend/wallet/apps/web/src:/app/frontend/wallet/apps/web/src:ro
      - ./frontend/wallet/packages:/app/frontend/wallet/packages:ro
      - ./shared:/app/shared:ro
    depends_on:
      layer2ledgerapihandler:
        condition: service_started
      layer2ledgeroauthmanager:
        condition: service_started
    restart: "no"

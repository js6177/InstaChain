# Reverse proxy / LB for layer2ledgerapihandler Docker replicas.
#
# Upstream server list is generated by nginx.layer2ledgerapihandler.entrypoint.dev.sh
# (real IPs + keepalive). The entrypoint refreshes DNS and reloads nginx when
# replica IPs change, avoiding stale static upstreams after compose recreate.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
	worker_connections 16384;
	multi_accept on;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nodelay on;
	keepalive_timeout 65;

	# Client-facing (in) vs upstream (out) fields for throughput analysis.
	# upstream_* is "-" when the request never reached a backend.
	log_format throughput '$time_iso8601 '
		'method=$request_method '
		'uri=$uri '
		'status=$status '
		'rt=$request_time '
		'upstream_status=$upstream_status '
		'upstream_rt=$upstream_response_time '
		'upstream_addr=$upstream_addr '
		'bytes_sent=$bytes_sent';

	# Generated by entrypoint: upstream apihandlers { ... keepalive ... }
	include /etc/nginx/upstream-apihandlers.conf;

	server {
		listen 8000;
		server_name _;

		# Proxy liveness only (does not prove backends are reachable).
		location = /nginx-health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		# Cumulative accept/handled/requests counters (scrape for RPS deltas).
		location = /nginx-status {
			access_log off;
			stub_status on;
			# Compose network only; not published as a separate host port.
			allow 127.0.0.1;
			allow 172.16.0.0/12;
			allow 10.0.0.0/8;
			allow 192.168.0.0/16;
			deny all;
		}

		location / {
			access_log /var/log/nginx/throughput.log throughput;

			proxy_pass http://apihandlers;
			proxy_http_version 1.1;
			# Empty Connection enables upstream keepalive reuse.
			proxy_set_header Connection "";

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Request-Id $http_x_request_id;

			proxy_connect_timeout 5s;
			proxy_send_timeout 120s;
			proxy_read_timeout 120s;
		}
	}
}

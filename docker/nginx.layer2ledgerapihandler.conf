# Reverse proxy for layer2ledgerapihandler Docker replicas.
#
# IMPORTANT: do not put the backend hostname in a static `upstream { server ... }`
# block. Nginx resolves that once at start; when Compose recreates replicas their
# IPs change and nginx keeps proxying to dead addresses → 502 Connection refused.
#
# Variable proxy_pass + Docker DNS resolver re-resolves on each request (valid=).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
	worker_connections 16384;
	multi_accept on;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	sendfile on;
	tcp_nodelay on;
	keepalive_timeout 65;

	# Docker embedded DNS — re-resolve replica A records frequently.
	resolver 127.0.0.11 valid=2s ipv6=off;
	resolver_timeout 5s;

	server {
		listen 8000;
		server_name _;

		# Proxy liveness only (does not prove backends are reachable).
		location = /nginx-health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		location / {
			# Runtime DNS lookup of current replica IPs (Docker DNSRR rotates/returns all).
			set $backend "layer2ledgerapihandler:8000";
			proxy_pass http://$backend;

			proxy_http_version 1.1;
			proxy_set_header Connection "";

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Request-Id $http_x_request_id;

			proxy_connect_timeout 5s;
			proxy_send_timeout 120s;
			proxy_read_timeout 120s;
		}
	}
}

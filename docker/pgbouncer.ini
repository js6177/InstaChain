; PgBouncer in front of layer2ledger-postgres for apihandler replicas.
; dbwriter connects to Postgres directly (not through this pooler).

[databases]
; Forward any database name to Postgres; client credentials are reused for server auth.
* = host=layer2ledger-postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
user = postgres
auth_file = /etc/pgbouncer/userlist.txt
auth_type = plain
pool_mode = transaction
default_pool_size = 20
max_client_conn = 1000
ignore_startup_parameters = extra_float_digits
admin_users = postgres

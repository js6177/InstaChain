# Test overlay — used with docker-compose.yml via python3 run-tests.py (make test)
# Sets ENVIRONMENT=test for backend services.
#
# bitcoin-core must use .config/test/bitcoin.conf (RPC credentials must match layer2bridge).
# run-tests.py sets ENVIRONMENT=test in the shell; backend-test relies on the volume override below.
#
# Services with profiles: [test] are not stopped by plain `docker compose down`.
# Use: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test down
# Or: make test-down / make test-down-v

services:
  bitcoin-core:
    volumes: !override
      - bitcoin_core_data:/home/bitcoin/.bitcoin
      - ./.config/test/bitcoin.conf:/config/bitcoin.conf:ro

  layer2ledger-postgres:
    env_file:
      - ./backend/layer2ledgerbatched/.env.test
    environment:
      ENVIRONMENT: test

  layer2ledger-redis:
    environment:
      ENVIRONMENT: test

  layer2ledger-mongodb:
    environment:
      ENVIRONMENT: test

  layer2ledgerapihandler:
    env_file:
      - ./backend/layer2ledgerbatched/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  layer2ledgerdbwriter:
    env_file:
      - ./backend/layer2ledgerbatched/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'layer2ledgerdbwriter.main'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  layer2ledgeroauthmanager:
    env_file:
      - ./backend/layer2ledgeroauthmanager/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config

  layer2bridge:
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      OPENL2_OUTPUT_PATH: /app/.output
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'layer2bridge.main'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  layer2ledger-testhelper:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgertesthelper
    ports:
      - "${TESTHELPER_PORT:-8001}:8001"
    env_file:
      - ./backend/layer2ledgerbatched/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      PYTHONPATH: /app/layer2ledgerbatched/src
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/testhelper/health')\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: "no"

  test-layer2ledgerbatched:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.test.layer2ledgerbatched
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      PYTHONPATH: /app/layer2ledgerbatched/src
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: "no"

  test-layer2bridge:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.test.layer2bridge
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      OPENL2_OUTPUT_PATH: /app/.output
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
      layer2ledgerdbwriter:
        condition: service_healthy
      layer2bridge:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
    restart: "no"

  test-bitcoin-core-rpc:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.bitcoin-core-rpc
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      bitcoin-core:
        condition: service_healthy
    restart: "no"

  test-layer2ledgeroauthmanager:
    profiles: [test]
    image: curlimages/curl:8.11.1
    command:
      [
        "curl",
        "-fsS",
        "http://layer2ledgeroauthmanager:4000/health",
      ]
    depends_on:
      layer2ledger-mongodb:
        condition: service_healthy
      layer2ledgeroauthmanager:
        condition: service_healthy
    restart: "no"

  test-layer2ledger-seed:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.test.layer2ledger-seed
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      PYTHONPATH: /app/layer2ledgerbatched/src
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledgerbatched/test-seed-config.json:/app/test-seed-config.json:ro
      - ./frontend/wallet/apps/web/test/test.keys.json:/seed/test.keys.json:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
    restart: "no"

  test-wallet-web:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.wallet-web
    shm_size: '1gb'
    environment:
      ENVIRONMENT: test
      VITEST_DOCKER: "1"
    env_file:
      - ./frontend/wallet/.env.test.docker
    volumes:
      - ./.config/test/layer2ledgerbridge-config.json:/app/frontend/wallet/apps/web/test/test.bridge-config.json:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
      layer2ledger-mongodb:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
      layer2ledgerdbwriter:
        condition: service_healthy
      layer2ledger-testhelper:
        condition: service_healthy
      layer2ledgeroauthmanager:
        condition: service_healthy
      layer2bridge:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
    restart: "no"

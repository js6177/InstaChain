# Test overlay — used with docker-compose.yml via bun run test:docker (make test)
# Sets ENVIRONMENT=test for backend services.
#
# bitcoin-core must use .config/test/bitcoin.conf (RPC credentials must match layer2bridge).
# run-tests.ts (backend/setup_scripts) sets ENVIRONMENT=test in the shell; backend-test relies on the volume override below.
#
# Services with profiles: [test] are not stopped by plain `docker compose down`.
# Use: docker compose -f docker-compose.yml -f docker-compose.test.yml --profile test down
# Or: make test-down / make test-down-v

services:
  bitcoin-core:
    volumes: !override
      - bitcoin_core_data:/home/bitcoin/.bitcoin
      - ./.config/test/bitcoin.conf:/config/bitcoin.conf:ro

  layer2ledger-postgres:
    env_file:
      - ./backend/layer2ledger/.env.test
    environment:
      ENVIRONMENT: test

  layer2ledger-redis:
    environment:
      ENVIRONMENT: test

  layer2ledger-mongodb:
    environment:
      ENVIRONMENT: test

  layer2ledgerapihandler:
    env_file:
      - ./backend/layer2ledger/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config

  layer2ledgerapihandler-nginx:
    environment:
      ENVIRONMENT: test

  layer2ledgerdbwriter:
    env_file:
      - ./backend/layer2ledger/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'layer2ledgerdbwriter/index.ts'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  layer2ledgeroauthmanager:
    env_file:
      - ./backend/layer2ledgeroauthmanager/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config

  layer2bridge:
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      OPENL2_OUTPUT_PATH: /app/.output
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'src/main.ts'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  layer2ledger-testhelper:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2ledgertesthelper
    ports:
      - "${TESTHELPER_PORT:-8001}:8001"
    env_file:
      - ./backend/layer2ledger/.env.test
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:8001/testhelper/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: "no"

  test-layer2ledger:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.layer2ledger
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: "no"

  # HTTP E2E stress against live apihandler + dbwriter (skipped in unit bun test).
  # testhelper is started by backend/setup_scripts/run-tests.ts before integration.
  test-layer2ledger-stress:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.layer2ledger
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      RUN_LEDGER_HTTP_STRESS: "1"
      STRESS_TX_COUNT: ${STRESS_TX_COUNT:-100}
      STRESS_CONCURRENCY: ${STRESS_CONCURRENCY:-10}
      STRESS_SETTLE_TIMEOUT_MS: ${STRESS_SETTLE_TIMEOUT_MS:-120000}
      LAYER2LEDGER_API_URL: http://layer2ledgerapihandler-nginx:8000
      TESTHELPER_BASE_URL: http://layer2ledger-testhelper:8001
      STRESS_RESULT_FILE: /test-output/test-layer2ledger-stress.throughput.json
    command: ["bun", "test", "test/stress.test.ts"]
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
      layer2ledgerapihandler-nginx:
        condition: service_healthy
      layer2ledgerdbwriter:
        condition: service_healthy
    restart: "no"

  test-layer2bridge:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.layer2bridge
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
      OPENL2_OUTPUT_PATH: /app/.output
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
      layer2ledgerapihandler-nginx:
        condition: service_healthy
      layer2ledgerdbwriter:
        condition: service_healthy
      layer2bridge:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
    restart: "no"

  test-bitcoin-core-rpc:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.bitcoin-core-rpc
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      bitcoin-core:
        condition: service_healthy
    restart: "no"

  test-layer2ledgeroauthmanager:
    profiles: [test]
    image: curlimages/curl:8.11.1
    command:
      [
        "curl",
        "-fsS",
        "http://layer2ledgeroauthmanager:4000/health",
      ]
    depends_on:
      layer2ledger-mongodb:
        condition: service_healthy
      layer2ledgeroauthmanager:
        condition: service_healthy
    restart: "no"

  test-layer2ledger-seed:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.layer2ledger-seed
    environment:
      ENVIRONMENT: test
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
      - ./backend/layer2ledger/test-seed-config.json:/app/test-seed-config.json:ro
      - ./frontend/wallet/apps/web/test/test.keys.json:/seed/test.keys.json:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
      layer2ledgerapihandler-nginx:
        condition: service_healthy
    restart: "no"

  test-wallet-web:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/Dockerfile.test.wallet-web
    shm_size: '1gb'
    environment:
      ENVIRONMENT: test
      VITEST_DOCKER: "1"
    env_file:
      - ./frontend/wallet/.env.test.docker
    volumes:
      - ./.config/test/layer2ledgerbridge-config.json:/app/frontend/wallet/apps/web/test/test.bridge-config.json:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
      layer2ledger-mongodb:
        condition: service_healthy
      layer2ledgerapihandler:
        condition: service_healthy
      layer2ledgerapihandler-nginx:
        condition: service_healthy
      layer2ledgerdbwriter:
        condition: service_healthy
      # testhelper is started by backend/setup_scripts/run-tests.ts (ensureTesthelper) before integration
      # tests. Do not list it here — compose run would recreate it, re-run migrations,
      # and wipe seed data before vitest runs.
      layer2ledgeroauthmanager:
        condition: service_healthy
      layer2bridge:
        condition: service_healthy
      bitcoin-core:
        condition: service_healthy
    restart: "no"

[project]
name = "openl2-messaging"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "config-models",
    "config-loader",
    "layer2address"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
config-models = { path = "../config_models", editable = true }
config-loader = { path = "../config_loader", editable = true }
layer2address = { path = "../layer2address", editable = true }
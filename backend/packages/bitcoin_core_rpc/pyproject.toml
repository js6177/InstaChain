[project]
name = "bitcoin-core-rpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
uires-python = ">=3.12"
dependencies = [
    "config-models",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.scripts]
bitcoin-core-rpc = "bitcoin_core_rpc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
config-models = { path = "../config_models" }

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
]

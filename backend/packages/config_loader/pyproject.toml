[project]
name = "config-loader"
version = "0.1.0"
description = "config-loader is a library that contains the logic to load config files that every backend service and setup_scripts can share"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "config-models",
    "pydantic>=2.12.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
config-models = { path = "../config_models", editable = true }

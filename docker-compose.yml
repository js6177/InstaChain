# Base stack: production-like defaults (ENVIRONMENT defaults to prod).
# For local development with debug ports and source mounts, use: make dev
version: '3.8'

services:
  layer2ledger-postgres:
    image: postgres:16-alpine
    env_file:
      - ./backend/layer2ledgerbatched/.env.${ENVIRONMENT:-prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  layer2ledger-redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  layer2ledger-mongodb:
    image: mongo:7
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  layer2ledgerapihandler:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgerapihandler
    ports:
      - "${LAYER2LEDGER_FASTAPI_PORT:-8000}:8000"
    env_file:
      - ./backend/layer2ledgerbatched/.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: unless-stopped

  layer2ledgerdbwriter:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgerdbwriter
    env_file:
      - ./backend/layer2ledgerbatched/.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: unless-stopped

  layer2ledgeroauthmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2ledgeroauthmanager
    ports:
      - "${LAYER2OAUTH_PORT:-4000}:4000"
    env_file:
      - ./backend/layer2ledgeroauthmanager/.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  wallet-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.wallet-web
      target: runner
    ports:
      - "${WALLET_WEB_PORT:-5173}:80"
    depends_on:
      layer2ledgerapihandler:
        condition: service_started
      layer2ledgeroauthmanager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
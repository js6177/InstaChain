version: '3.8'

services:
  layer2ledger-postgres:
    image: postgres:16-alpine
    env_file:
      - ./backend/layer2ledgerbatched/.env.${ENVIRONMENT:-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  layer2ledger-redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  layer2ledger-mongodb:
    image: mongo:7
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  layer2ledgerapihandler:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgerapihandler
    ports:
      - "${LAYER2LEDGER_FASTAPI_PORT:-8000}:8000"
    env_file:
      - ./backend/layer2ledgerbatched/.env.${ENVIRONMENT:-dev}
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: unless-stopped

  layer2ledgerdbwriter:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.layer2ledgerdbwriter
    env_file:
      - ./backend/layer2ledgerbatched/.env.${ENVIRONMENT:-dev}
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: unless-stopped

  layer2ledgeroauthmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2ledgeroauthmanager
    ports:
      - "${LAYER2OAUTH_PORT:-4000}:4000"
    env_file:
      - ./backend/layer2ledgeroauthmanager/.env.${ENVIRONMENT:-dev}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      OPENL2_OAUTH_CONFIG_PATH: /app/config/config.json
    volumes:
      - ./.config/${ENVIRONMENT:-dev}/layer2ledgeroauthmanager-config.json:/app/config/config.json:ro
    depends_on:
      layer2ledger-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch(`http://127.0.0.1:$${SERVER_PORT}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
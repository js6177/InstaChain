# Base stack: production-like defaults (ENVIRONMENT defaults to prod).
# For local development with debug ports and source mounts, use: make dev

services:
  layer2ledger-postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    env_file:
      - ./backend/layer2ledger/.env.${ENVIRONMENT:-prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Transaction-mode pooler for apihandler replicas. dbwriter connects to postgres directly.
  layer2ledger-pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p2
    volumes:
      - ./docker/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./docker/pgbouncer.userlist.txt:/etc/pgbouncer/userlist.txt:ro
    expose:
      - "6432"
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  layer2ledger-redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  layer2ledger-mongodb:
    image: mongo:7
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  layer2ledgerapihandler:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2ledgerapihandler
    # Replicas are reached via layer2ledgerapihandler-nginx (host port mapping).
    expose:
      - "8000"
    env_file:
      - ./backend/layer2ledger/.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
      # SigNoz / OTLP (no-op when collector is down; see docker-compose.signoz.yml)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: layer2ledgerapihandler
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-pgbouncer:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:8000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      # Override at up-time: LAYER2LEDGER_APIHANDLER_REPLICAS=N docker compose up --scale layer2ledgerapihandler=N
      replicas: 8
    restart: unless-stopped

  # Reverse proxy / LB in front of apihandler replicas (round-robin).
  layer2ledgerapihandler-nginx:
    image: nginx:1.27-alpine
    ports:
      - "${LAYER2LEDGER_FASTAPI_PORT:-8000}:8000"
    volumes:
      - ./docker/nginx.layer2ledgerapihandler.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      layer2ledgerapihandler:
        condition: service_healthy
    healthcheck:
      # Probe a real backend via the proxy (not /nginx-health) so stale upstream
      # IPs after apihandler recreate cannot leave nginx "healthy" while serving 502.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8000/ | grep -q Success",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  layer2ledgerdbwriter:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2ledgerdbwriter
    env_file:
      - ./backend/layer2ledger/.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: layer2ledgerdbwriter
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-postgres:
        condition: service_healthy
      layer2ledger-redis:
        condition: service_healthy
    restart: unless-stopped

  layer2ledgeroauthmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2ledgeroauthmanager
    ports:
      - "${LAYER2OAUTH_PORT:-4000}:4000"
    env_file:
      - ./backend/layer2ledgeroauthmanager/.env.${ENVIRONMENT:-prod}
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: layer2ledgeroauthmanager
    volumes:
      - ./.config:/app/.config:ro
    depends_on:
      layer2ledger-mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bitcoin-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.bitcoin-core
    stop_grace_period: 30s
    stop_signal: SIGTERM
    ports:
      - "127.0.0.1:${BITCOIN_RPC_PORT:-8334}:8334"
    volumes:
      - bitcoin_core_data:/home/bitcoin/.bitcoin
      - ./.config/${ENVIRONMENT:-prod}/bitcoin.conf:/config/bitcoin.conf:ro
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/bitcoin-core-healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
      # Probe frequently during start_period so the container is marked healthy
      # within seconds of bitcoind being ready (instead of waiting a full interval).
      start_interval: 3s
    restart: unless-stopped

  layer2bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.layer2bridge
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-prod}
      OPENL2_CONFIG_PATH: /app/.config
      OPENL2_OUTPUT_PATH: /app/.output
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-otel-collector:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_SERVICE_NAME: layer2bridge
    volumes:
      - ./.config:/app/.config:ro
      - layer2bridge_output:/app/.output
    depends_on:
      bitcoin-core:
        condition: service_healthy
      layer2ledgerapihandler-nginx:
        condition: service_healthy
    restart: unless-stopped

  wallet-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.wallet-web
      target: runner
    ports:
      - "${WALLET_WEB_PORT:-5173}:80"
    depends_on:
      layer2ledgerapihandler-nginx:
        condition: service_healthy
      layer2ledgeroauthmanager:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  bitcoin_core_data:
    name: openl2-bitcoin-core-data
  layer2bridge_output: